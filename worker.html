<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статус серверов — Destr Connect</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #16161c;
      --text: #f4f4f5;
      --hint: #a1a1aa;
      --up: #34c759;
      --down: #ff3b30;
      --line: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 20px 48px;
    }
    .wrap { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .sub { color: var(--hint); font-size: 14px; margin: 8px 0 24px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: none; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      margin-top: 5px; flex-shrink: 0;
      background: var(--hint);
    }
    .dot.up { background: var(--up); box-shadow: 0 0 10px rgba(52,199,89,0.5); }
    .dot.down, .dot.degraded { background: var(--down); box-shadow: 0 0 10px rgba(255,59,48,0.35); }
    .name { font-size: 16px; font-weight: 600; }
    .msg { font-size: 13px; color: var(--hint); margin-top: 4px; line-height: 1.4; }
    .foot { margin-top: 20px; font-size: 12px; color: var(--hint); text-align: center; }
    .err { color: var(--down); padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Статус серверов</h1>
    <p class="sub" id="updated">Обновление…</p>
    <div class="card" id="list">
      <div class="row"><div class="msg">Загрузка…</div></div>
    </div>
    <p class="foot">Destr Connect · автообновление каждые 30 сек</p>
  </div>
<script>
async function load() {
  const list = document.getElementById('list');
  const updated = document.getElementById('updated');
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || 'error');
    updated.textContent = 'Обновлено: ' + new Date(data.updatedAt).toLocaleString('ru-RU');
    if (!data.servers?.length) {
      list.innerHTML = '<div class="row"><div class="msg">Серверы не настроены в ENV</div></div>';
      return;
    }
    list.innerHTML = data.servers.map((s) => {
      const st = s.status === 'up' ? 'up' : 'down';
      const line = s.label + ' — ' + s.message;
      return (
        '<div class="row">' +
          '<div class="dot ' + st + '"></div>' +
          '<div><div class="name">' + escapeHtml(s.label) + '</div>' +
          '<div class="msg">' + escapeHtml(s.message) +
          (s.ms != null ? ' · ' + s.ms + ' мс' : '') +
          '</div></div></div>'
      );
    }).join('');
  } catch (e) {
    list.innerHTML = '<div class="err">Не удалось загрузить статус</div>';
    updated.textContent = e.message || '';
  }
}
function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
  );
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
