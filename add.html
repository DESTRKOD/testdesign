<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Добавить подписку — DxS Connect</title>
  <script src="https://telegram.org/js/telegram-web-app.js?56"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --hint: #8e8e93;
      --btn: #3390ec;
      --btn-text: #ffffff;
      --secondary: #f2f2f7;
    }
    html.dark {
      --bg: #000000;
      --text: #ffffff;
      --hint: #8e8e93;
      --btn: #3390ec;
      --btn-text: #ffffff;
      --secondary: #1c1c1e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(160deg, #5eb0f7, #3390ec);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(51, 144, 236, 0.28);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      line-height: 1.4;
      color: var(--hint);
      max-width: 320px;
      margin-bottom: 28px;
    }
    .btn {
      width: 100%;
      max-width: 340px;
      height: 50px;
      border: none;
      border-radius: 12px;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 17px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.45; }
    .btn.secondary {
      margin-top: 12px;
      background: var(--secondary);
      color: var(--btn);
    }
    .err {
      margin-top: 16px;
      font-size: 14px;
      color: #ff3b30;
      display: none;
    }
    .err.show { display: block; }
  </style>
</head>
<body>
  <div class="icon" aria-hidden="true">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </div>
  <h1>Подписка готова</h1>
  <p id="hint">Нажмите кнопку, чтобы добавить конфигурацию в Happ</p>
  <button type="button" class="btn" id="btn-add" disabled>
    Добавить подписку
  </button>
  <button type="button" class="btn secondary" id="btn-copy">
    Скопировать ссылку
  </button>
  <div class="err" id="err"></div>

<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      if (tg.colorScheme === 'dark') document.documentElement.classList.add('dark');
      if (tg.themeParams) {
        const p = tg.themeParams;
        if (p.bg_color) document.documentElement.style.setProperty('--bg', p.bg_color);
        if (p.text_color) document.documentElement.style.setProperty('--text', p.text_color);
        if (p.hint_color) document.documentElement.style.setProperty('--hint', p.hint_color);
        if (p.button_color) document.documentElement.style.setProperty('--btn', p.button_color);
        if (p.button_text_color) document.documentElement.style.setProperty('--btn-text', p.button_text_color);
        if (p.secondary_bg_color) document.documentElement.style.setProperty('--secondary', p.secondary_bg_color);
      }
    } catch (_) {}
  }

  const params = new URLSearchParams(location.search);
  let subUrl = params.get('url') || '';
  const token = params.get('token') || '';

  if (!subUrl && token) {
    subUrl = location.origin + '/api/sub?token=' + encodeURIComponent(token);
  }

  // legacy: path /add/TOKEN
  if (!subUrl && !token) {
    const parts = location.pathname.split('/').filter(Boolean);
    if (parts[0] === 'add' && parts[1]) {
      subUrl = location.origin + '/api/sub?token=' + encodeURIComponent(parts[1]);
    }
  }

  const btn = document.getElementById('btn-add');
  const btnCopy = document.getElementById('btn-copy');
  const err = document.getElementById('err');
  const hint = document.getElementById('hint');

  if (!subUrl) {
    err.textContent = 'Нет ссылки подписки. Вернитесь в приложение и нажмите «Добавить устройство».';
    err.classList.add('show');
    btnCopy.disabled = true;
    return;
  }

  btn.disabled = false;

  function isTelegramMiniApp() {
    try {
      if (tg && tg.initData) return true;
      if (window.TelegramWebviewProxy) return true;
    } catch (_) {}
    return false;
  }

  function openHapp() {
    const encoded = encodeURIComponent(subUrl);
    // Happ import schemes (try several)
    const schemes = [
      'happ://add/' + encoded,
      'happ://import/' + encoded
    ];
    try {
      window.location.href = schemes[0];
    } catch (_) {}
    // iOS sometimes needs iframe/location trick
    setTimeout(function () {
      const a = document.createElement('a');
      a.href = schemes[0];
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, 50);
  }

  function copyLink() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(subUrl);
    }
    const ta = document.createElement('textarea');
    ta.value = subUrl;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
    return Promise.resolve();
  }

  btn.addEventListener('click', function () {
    try {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
    } catch (_) {}
    copyLink().catch(function () {});
    openHapp();
  });

  btnCopy.addEventListener('click', function () {
    copyLink()
      .then(function () {
        btnCopy.textContent = 'Скопировано';
        setTimeout(function () { btnCopy.textContent = 'Скопировать ссылку'; }, 1500);
        try {
          if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        } catch (_) {}
      })
      .catch(function () {
        err.textContent = 'Не удалось скопировать';
        err.classList.add('show');
      });
  });

  // Outside Mini App → go to Happ immediately
  if (!isTelegramMiniApp()) {
    hint.textContent = 'Открываем Happ…';
    copyLink().catch(function () {});
    openHapp();
  }
})();
</script>
</body>
</html>
